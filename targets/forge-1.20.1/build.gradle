plugins {
    id 'eclipse'
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'jacoco'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-forge-1.20.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

// common/ is a shared source tree that also compiles standalone
// (`gradlew -p common build`, see common/build.gradle). Everything without a
// confirmed version difference lives there, so its sources are compiled into
// this target by source-set sharing. Its shared resources directory is wired in
// by gradle/target-conventions/publish.gradle.
sourceSets {
    main {
        java.srcDir "$buildDir/generated/common-main"
        resources.srcDir 'src/generated/resources'
    }
    test {
        java.srcDir '../../common/src/test/java'
        resources.srcDir '../../common/src/test/resources'
        // Unit tests touch Minecraft types (BlockPos/Vec3), so they need the mod classpath.
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.register('prepareCommonSources', Sync) {
    from('../../common/src/main/java') {
        // This target's version differences are registered here: exclude one
        // path per common file that this target replaces with its own
        // implementation, for example
        //     exclude 'com/example/network/ChunkPacket.java'
        // Everything not listed here stays shared with every other target.

        // 1.21 payload API (StreamCodec/CustomPacketPayload) does not exist before 1.20.5.
        exclude 'cc/sighs/dreamworld/net/DWPayloads.java'

        // SavedData.Factory, loadAdditional(CompoundTag, HolderLookup.Provider),
        // MapCodec, Entity#defineSynchedData(Builder), ItemStack#hurtAndBreak(.., EquipmentSlot),
        // Item#getUseDuration(ItemStack, LivingEntity), ResourceLocation.fromNamespaceAndPath,
        // the 1.21 VertexConsumer (addVertex/setUv) and the 1.21 GuiGraphics text helper
        // all differ from 1.20.1. Each of these files has a 1.20.1 implementation in this target.
        exclude 'cc/sighs/dreamworld/block/DreamGraffitiBlock.java'
        exclude 'cc/sighs/dreamworld/block/DreamGraffitiBlockEntity.java'
        exclude 'cc/sighs/dreamworld/client/DreamBlink.java'
        exclude 'cc/sighs/dreamworld/client/DreamHud.java'
        exclude 'cc/sighs/dreamworld/client/DreamVisuals.java'
        exclude 'cc/sighs/dreamworld/client/PetalSilhouette.java'
        exclude 'cc/sighs/dreamworld/client/entity/BlubModel.java'
        exclude 'cc/sighs/dreamworld/client/entity/BlubRenderer.java'
        exclude 'cc/sighs/dreamworld/client/entity/DreamSpearRenderer.java'
        exclude 'cc/sighs/dreamworld/dream/DreamPatches.java'
        exclude 'cc/sighs/dreamworld/dream/GraffitiRegistry.java'
        exclude 'cc/sighs/dreamworld/entity/BlubEntity.java'
        exclude 'cc/sighs/dreamworld/entity/DreamClayEntity.java'
        exclude 'cc/sighs/dreamworld/entity/DreamSpearEntity.java'
        exclude 'cc/sighs/dreamworld/item/DreamShovelItem.java'
        exclude 'cc/sighs/dreamworld/item/DreamSpearItem.java'
        exclude 'cc/sighs/dreamworld/item/DreamSwordItem.java'
        exclude 'cc/sighs/dreamworld/item/DreamTeaItem.java'
        exclude 'cc/sighs/dreamworld/item/DreamTier.java'
        exclude 'cc/sighs/dreamworld/item/DreamWandItem.java'
    }
    into "$buildDir/generated/common-main"
}
tasks.named('compileJava').configure { dependsOn 'prepareCommonSources' }
tasks.named('sourcesJar', Jar).configure { dependsOn 'prepareCommonSources' }

legacyForge {
    version = "${forge_minecraft_version}-${forge_version}"
    validateAccessTransformers = true
    accessTransformers {
        file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            client()
            gameDirectory = file('run')
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            // Forge 1.20.1 loads mixin configs from the jar manifest, which a dev run of a
            // directory mod file does not have; the ModLauncher mixin service takes them here.
            programArguments.addAll '--mixin.config', 'dreamworld.mixins.json',
                    '--mixin.config', 'dreamworld.client.mixins.json'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
            programArguments.addAll '--mixin.config', 'dreamworld.mixins.json'
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing', file('../../common/src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "MinecraftForge"
        url = "https://maven.minecraftforge.net/"
        content {
            includeGroup "net.minecraftforge"
        }
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('processResources', ProcessResources).configure {
    // 1.20.1 reads data/dreamworld/recipes and data/dreamworld/loot_tables; the shared 1.21
    // singular directories are replaced by this target's own copies.
    exclude 'data/dreamworld/recipe/**'
    exclude 'data/dreamworld/loot_table/**'
    def replaceProperties = [
            minecraft_version      : forge_minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : forge_loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                    // Forge 1.20.1 has no [[mixins]] block in mods.toml; Mixin reads the configs
                    // from the mod jar manifest instead.
                    "MixinConfigs"            : "dreamworld.mixins.json,dreamworld.client.mixins.json"])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.named('test', Test).configure {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport', JacocoReport).configure {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

apply from: file('../../gradle/target-conventions/publish.gradle')

// Forge runs SRG-named classes in production, so the mixin annotations need a refmap.
dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

sourceSets.main.resources.srcDir "$buildDir/generated/mixins"
def mixinRefmap = file("$buildDir/generated/mixins/dreamworld.refmap.json")

tasks.named('compileJava', JavaCompile).configure {
    def tsrg = file("$buildDir/moddev/artifacts/namedToIntermediate.tsrg")
    dependsOn 'createMinecraftArtifacts'
    doFirst {
        mixinRefmap.parentFile.mkdirs()
    }
    options.compilerArgs += [
            '-AreobfTsrgFile=' + tsrg.absolutePath,
            '-AmappingTypes=tsrg',
            '-AdefaultObfuscationEnv=searge',
            '-AoutRefMapFile=' + mixinRefmap.absolutePath,
            '-Aquiet=true'
    ]
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn 'compileJava'
}
tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-fabric-26.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

// common/ is a shared source tree that also compiles standalone
// (`gradlew -p common build`, see common/build.gradle). Everything without a
// confirmed version difference lives there, so its sources are compiled into
// this target by source-set sharing. Its shared resources directory is wired in
// by gradle/target-conventions/publish.gradle.
sourceSets {
    main {
        java.srcDir "$buildDir/generated/common-main"
    }
    test {
        java.srcDir '../../common/src/test/java'
        resources.srcDir '../../common/src/test/resources'
    }
}

tasks.register('prepareCommonSources', Sync) {
    from('../../common/src/main/java') {
        // This target's version differences are registered here: exclude one
        // path per common file that this target replaces with its own
        // implementation, for example
        //     exclude 'com/example/network/ChunkPacket.java'
        // Everything not listed here stays shared with every other target.
        // 26.1 ships deobfuscated with renames (ResourceLocation -> Identifier,
        // Boat package move, ItemInstance/ItemStackTemplate, Optional NBT
        // getters, GUI/render pipeline overhaul), so every shared file that
        // touches a renamed API is replaced by the copy under
        // src/main/java of this target.
        exclude 'cc/sighs/dreamworld/block/DreamGraffitiBlock.java'
        exclude 'cc/sighs/dreamworld/block/DreamGraffitiBlockEntity.java'
        exclude 'cc/sighs/dreamworld/boat/DreamBoatGate.java'
        exclude 'cc/sighs/dreamworld/client/DWClientPayloadHandler.java'
        exclude 'cc/sighs/dreamworld/client/DreamBlink.java'
        exclude 'cc/sighs/dreamworld/client/DreamBlockTint.java'
        exclude 'cc/sighs/dreamworld/client/DreamBoatControls.java'
        exclude 'cc/sighs/dreamworld/client/DreamBoatTrail.java'
        exclude 'cc/sighs/dreamworld/client/DreamClientPatches.java'
        exclude 'cc/sighs/dreamworld/client/DreamHud.java'
        exclude 'cc/sighs/dreamworld/client/DreamVisuals.java'
        exclude 'cc/sighs/dreamworld/client/DreamWeather.java'
        exclude 'cc/sighs/dreamworld/client/PetalSilhouette.java'
        exclude 'cc/sighs/dreamworld/client/entity/BlubModel.java'
        exclude 'cc/sighs/dreamworld/client/entity/BlubRenderer.java'
        exclude 'cc/sighs/dreamworld/client/entity/DreamSpearRenderer.java'
        exclude 'cc/sighs/dreamworld/client/particle/DreamPetalParticle.java'
        exclude 'cc/sighs/dreamworld/dream/DreamCommand.java'
        exclude 'cc/sighs/dreamworld/dream/DreamDamageRules.java'
        exclude 'cc/sighs/dreamworld/dream/DreamEntities.java'
        exclude 'cc/sighs/dreamworld/dream/DreamIntrusion.java'
        exclude 'cc/sighs/dreamworld/dream/DreamManager.java'
        exclude 'cc/sighs/dreamworld/dream/DreamMobs.java'
        exclude 'cc/sighs/dreamworld/dream/DreamPatchSync.java'
        exclude 'cc/sighs/dreamworld/dream/DreamPatches.java'
        exclude 'cc/sighs/dreamworld/dream/DreamSleepEvents.java'
        exclude 'cc/sighs/dreamworld/dream/DreamWorldRules.java'
        exclude 'cc/sighs/dreamworld/dream/GraffitiRegistry.java'
        exclude 'cc/sighs/dreamworld/entity/BlubEntity.java'
        exclude 'cc/sighs/dreamworld/entity/DreamClayEntity.java'
        exclude 'cc/sighs/dreamworld/entity/DreamSpearEntity.java'
        exclude 'cc/sighs/dreamworld/item/DreamShovelItem.java'
        exclude 'cc/sighs/dreamworld/item/DreamSpearItem.java'
        exclude 'cc/sighs/dreamworld/item/DreamSwordItem.java'
        exclude 'cc/sighs/dreamworld/item/DreamTeaItem.java'
        exclude 'cc/sighs/dreamworld/item/DreamTier.java'
        exclude 'cc/sighs/dreamworld/item/DreamToolEvents.java'
        exclude 'cc/sighs/dreamworld/item/DreamWandItem.java'
        exclude 'cc/sighs/dreamworld/net/DWPayloads.java'
        exclude 'cc/sighs/dreamworld/net/DreamPackets.java'
        exclude 'cc/sighs/dreamworld/spi/DreamPlatform.java'
    }
    into "$buildDir/generated/common-main"
}
tasks.named('compileJava').configure { dependsOn 'prepareCommonSources' }
tasks.named('sourcesJar', Jar).configure {
    dependsOn 'prepareCommonSources'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${fabric_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def replaceProperties = [
            minecraft_version    : fabric_minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_api_version,
            mod_id               : mod_id,
            mod_name             : mod_name,
            mod_license          : mod_license,
            mod_version          : mod_version,
            mod_authors          : mod_authors,
            mod_description      : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

apply from: file('../../gradle/target-conventions/publish.gradle')

// 26.1 changed the recipe schema (ingredients are bare item ids, the old
// {"item": ...} object is rejected) and the shared tree still ships the 1.21.1
// recipes. Common's recipe directory is therefore taken out of the shared
// resource set and re-added here without it; this target ships the 26.1
// versions under src/main/resources/data/dreamworld/recipe.
def commonResources = file('../../common/src/main/resources')
sourceSets.main.resources.setSrcDirs(
        sourceSets.main.resources.srcDirs.findAll { it != commonResources })
tasks.named('processResources', ProcessResources).configure {
    from(commonResources) {
        exclude 'data/dreamworld/recipe/**'
    }
}

// The 26.1 dev launch does not inject an offline user, so authlib tries the live
// profile endpoint and aborts startup when it times out. A fixed offline user keeps
// runClient usable without network access.
tasks.named('runClient', JavaExec).configure {
    args '--username', 'Dev',
            '--uuid', '9e5d41e7-4785-3b2f-8261-593dade57f6e',
            '--accessToken', '0'
}

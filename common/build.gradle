// Standalone build for the shared source tree.
//
// common/ holds every piece of code that has no confirmed loader/version
// difference. It MAY reference Minecraft types: the split rule is "a confirmed
// version difference", not "platform independence". Loader APIs are reached
// through the SPI in cc.sighs.dreamworld.spi, never directly.
//
// It compiles against the NeoForge 1.21.1 classpath, the reference target of the
// current main version, so it can be built and tested on its own:
//
//     gradlew -p common build
//
// Targets do NOT include this as a Gradle subproject. They compile these same
// sources into their own source set through `prepareCommonSources` (see each
// target's build.gradle), and that task is also where a target excludes the
// common files that do have a version difference.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

def properties = new Properties()
file('../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neoforge_121_version
}

repositories {
    mavenCentral()
}

// Unit tests touch Minecraft types (BlockPos/Vec3), so they need the mod classpath.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}
